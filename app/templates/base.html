<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  {% if current_user %}
  <header class="shell-header">
    <div class="shell-brand">
      <div class="brand-mark">TF</div>
      <div>
        <div class="brand-title">{{ app_name }}</div>
        <div class="brand-subtitle">Операционная панель обмена документами</div>
      </div>
    </div>
    <div class="shell-actions">
      <div class="current-user">
        <span>{{ current_user.username }}</span>
        <span class="role-pill">{{ current_user.role }}</span>
      </div>
      {% if current_user.role == "admin" %}
      <a class="ghost-button" href="/admin/users">Пользователи</a>
      {% endif %}
      <form action="/logout" method="post">
        <button class="ghost-button" type="submit">Выйти</button>
      </form>
    </div>
  </header>
  {% endif %}

  {% if flash %}
  <div class="flash flash-{{ flash.level }}">
    {{ flash.message }}
  </div>
  {% endif %}

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
